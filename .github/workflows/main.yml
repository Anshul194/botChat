name: Deploy Next.js to cPanel

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: botchat-app/package-lock.json

      - name: Install dependencies
        working-directory: ./botchat-app
        run: npm ci --legacy-peer-deps

      - name: Build (standalone mode)
        working-directory: ./botchat-app
        env:
          NEXT_PUBLIC_SOCKET_URL: ${{ secrets.NEXT_PUBLIC_SOCKET_URL }}
          NODE_ENV: production
        run: npm run build

      # Copy public/ and static/ into standalone output (required by Next.js docs)
      - name: Prepare standalone output
        working-directory: ./botchat-app
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          cp server.js .next/standalone/server.js
          cp package.json .next/standalone/package.json
          mkdir -p .next/standalone/tmp
          touch .next/standalone/tmp/restart.txt

      # Zip the standalone folder — 1 file upload instead of 50,000!
      - name: Zip standalone output
        working-directory: ./botchat-app/.next
        run: zip -r ../../deploy.zip standalone/

      # Upload just ONE zip file — much faster than FTP of node_modules
      - name: Upload ZIP to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          local-dir: ./
          server-dir: botchat_next_deploy/
          log-level: minimal
          include: |
            deploy.zip

      # Extract zip on server using PHP helper
      - name: Trigger extraction on server
        run: |
          curl -s "https://megadm.chat/extract_deploy.php?secret=${{ secrets.DEPLOY_SECRET }}"
