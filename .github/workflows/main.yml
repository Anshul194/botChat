name: Deploy Next.js to cPanel

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: botchat-app/package-lock.json

      - name: Install ALL dependencies
        working-directory: ./botchat-app
        run: npm ci --legacy-peer-deps

      - name: Build Next.js
        working-directory: ./botchat-app
        env:
          NEXT_PUBLIC_SOCKET_URL: ${{ secrets.NEXT_PUBLIC_SOCKET_URL }}
          NODE_ENV: production
        run: npm run build

      - name: Remove dev dependencies (keep only production)
        working-directory: ./botchat-app
        run: npm prune --omit=dev --legacy-peer-deps

      - name: Create restart marker
        run: |
          mkdir -p ./botchat-app/tmp
          touch ./botchat-app/tmp/restart.txt

      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          local-dir: ./botchat-app/
          server-dir: botchat_next/
          log-level: verbose
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.env.local
            **/.env.admin
            **/.env.reseller
            **/.env.example
            **/.next/cache/**
            **/*.log
            **/startup-error.txt
            **/startup-success.txt
            **/.DS_Store
            **/__MACOSX/**
            **/*.mp4
            **/*.zip
            **/tsconfig.tsbuildinfo
            README.md
            **/*.md
