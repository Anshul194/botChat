---
deployment:
  tasks:

    # Deploy log
    - echo "DEPLOY $(date)" >> /home/megasfuh/deploy-log.txt

    # Sync latest source files to live app (node_modules is NOT in git, so it's not copied)
    - /bin/cp -R botchat-app/. /home/megasfuh/botchat_app/

    # Clean old build + node_modules for a fresh, reliable install
    - /bin/rm -rf /home/megasfuh/botchat_app/.next /home/megasfuh/botchat_app/node_modules

    # Install deps from lockfile + build. Fail loudly if anything is missing.
    - export PATH=/opt/cpanel/ea-nodejs20/bin:$PATH && cd /home/megasfuh/botchat_app && npm ci --no-audit --no-fund && npm run build && node -e "require('fs').existsSync('node_modules/next') || (console.error('FATAL: next is missing after install'); process.exit(1))"

    # Record a health marker so it's easy to confirm the deploy finished
    - echo "DEPLOY_DONE $(date) next=$(node -e "try{require('next/package.json');process.stdout.write('OK')}catch(e){process.stdout.write('MISSING')}")" >> /home/megasfuh/deploy-log.txt

    # Restart Node.js app
    - mkdir -p /home/megasfuh/botchat_app/tmp
    - touch /home/megasfuh/botchat_app/tmp/restart.txt
